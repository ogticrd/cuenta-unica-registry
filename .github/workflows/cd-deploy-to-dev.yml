name: Deploy to dev

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - '**.js*'
      - '**.ts*'
      - package*.json
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/cd-deploy-to-dev.yml

concurrency:
  # Ensures that only one workflow task will run at a time. Previous builds, if
  # already in process, will get cancelled. Only the latest commit will be allowed
  # to run, cancelling any workflows in between
  group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # PR deployments require both a trusted author and an org-owned source repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.owner.login == github.repository_owner &&
        contains(fromJSON('["MEMBER", "OWNER"]'), github.event.pull_request.author_association))
    uses: ./.github/workflows/sub-build-push-image.yml
    with:
      environment: development
      dockerfile_path: ./Dockerfile
      dockerfile_target: runner
      app_name: ${{ vars.APP_NAME }}
      registry: ${{ vars.GOOGLE_ARTIFACT_REGISTRY }}
    secrets: inherit

  deploy:
    # PR deployments require both a trusted author and an org-owned source repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.owner.login == github.repository_owner &&
        contains(fromJSON('["MEMBER", "OWNER"]'), github.event.pull_request.author_association))
    needs: [build]
    uses: ./.github/workflows/sub-cloudrun-deploy.yml
    with:
      environment: development
      project_id: ${{ vars.GOOGLE_PROJECT_ID }}
      region: ${{ vars.GOOGLE_CLOUD_REGION }}
      app_name: ${{ vars.APP_NAME }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      min_instances: '0'
      max_instances: '5'
      cpu: '1'
      memory: 512Mi
    secrets: inherit
